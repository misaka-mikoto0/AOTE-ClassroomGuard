# config.yaml - AOTE 管控系统配置文件

# 时间调度配置
# 上课时间段（宽松模式，不拦截）；非上课时间为严格模式（拦截）
schedule:
  weekday:
    # 周一至周五统一课表（第1节~第12节）
    1: [["05:45", "07:10"],   # 第1节
        ["08:05", "08:50"],   # 第2节
        ["09:00", "09:45"],   # 第3节
        ["10:20", "11:05"],   # 第4节
        ["11:15", "12:00"],   # 第5节
        ["14:30", "15:15"],   # 第6节
        ["15:25", "16:10"],   # 第7节
        ["16:20", "17:05"],   # 第8节
        ["17:35", "18:20"],   # 第9节
        ["19:00", "19:50"],   # 第10节
        ["20:00", "20:50"],   # 第11节
        ["21:00", "22:20"]]   # 第12节
    2: [["05:45", "07:10"], ["08:05", "08:50"], ["09:00", "09:45"], ["10:20", "11:05"], ["11:15", "12:00"], ["14:30", "15:15"], ["15:25", "16:10"], ["16:20", "17:05"], ["17:35", "18:20"], ["19:00", "19:50"], ["20:00", "20:50"], ["21:00", "22:20"]]
    3: [["05:45", "07:10"], ["08:05", "08:50"], ["09:00", "09:45"], ["10:20", "11:05"], ["11:15", "12:00"], ["14:30", "15:15"], ["15:25", "16:10"], ["16:20", "17:05"], ["17:35", "18:20"], ["19:00", "19:50"], ["20:00", "20:50"], ["21:00", "22:20"]]
    4: [["05:45", "07:10"], ["08:05", "08:50"], ["09:00", "09:45"], ["10:20", "11:05"], ["11:15", "12:00"], ["14:30", "15:15"], ["15:25", "16:10"], ["16:20", "17:05"], ["17:35", "18:20"], ["19:00", "19:50"], ["20:00", "20:50"], ["21:00", "22:20"]]
    5: [["05:45", "07:10"], ["08:05", "08:50"], ["09:00", "09:45"], ["10:20", "11:05"], ["11:15", "12:00"], ["14:30", "15:15"], ["15:25", "16:10"], ["16:20", "17:05"], ["17:35", "18:20"], ["19:00", "19:50"], ["20:00", "20:50"], ["21:00", "22:20"]]
    6: []                                          # 周六
    7: []                                          # 周日
  exceptions:
    "2026-09-10": "holiday"    # 教师节放假
    "2026-10-08": "classday"   # 调休上课

# 浏览器内容管控规则（基于域名，无需操作系统进程操作）
browser_rules:
  # 严格模式下拦截的娱乐/游戏域名（访问即触发数学挑战）
  block_domains:
    - "bilibili.com"
    - "youtube.com"
    - "youku.com"
    - "iqiyi.com"
    - "douyin.com"
    - "kuaishou.com"
    - "steampowered.com"
    - "epicgames.com"
    - "4399.com"
    - "7k7k.com"
    - "wanmei.com"
    - "gog.com"
  # 白名单域名（始终放行，如学习/政务站点）
  allowed_domains:
    - "edu.cn"
    - "gov.cn"
    - "baidu.com"
    - "bing.com"
    - "qq.com"
    - "alipay.com"
  # 数学挑战期间拦截的解题工具域名
  math_lockdown_domains:
    - "mathway.com"
    - "wolframalpha.com"
    - "symbolab.com"
    - "photomath.com"
    - "desmos.com"
    - "calculator.net"
    - "mathpapa.com"
    - "cymath.com"
    - "quickmath.com"
  # 自定义拦截页 HTML（留空使用内置默认页）
  blocked_page_html: ""
  math_lockdown_page_html: ""

# 数学挑战配置
math_challenge:
  level_1_reward_seconds: 300   # 难度一：5分钟
  level_2_reward_seconds: 600   # 难度二：10分钟
  question_timeout: 120         # 每题倒计时秒数，超时自动换题
  # 题目参数：四位数运算，结果必须是10位数
  question_params:
    min_number: 1000
    max_number: 9999
    result_min: 1000000000
    result_max: 9999999999
    operations: ["+", "-", "*", "/"]

# U盘授权配置
usb_guard:
  whitelist_serials:
    - "A1B2C3D4E5F6"
    - "G7H8I9J0K1L2"
  key_filename: ".guardian_key"
  # SHA-256 hash of "AOTE-Admin-Key-2026" (需要管理员修改)
  key_hash_sha256: "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8"

# 解锁模式
unlock_modes:
  - { name: "即拔即禁", type: "eject" }
  - { name: "30分钟", type: "timer", seconds: 1800 }
  - { name: "1小时", type: "timer", seconds: 3600 }
  - { name: "2小时", type: "timer", seconds: 7200 }

# 紧急/管理员配置
emergency:
  hotkey: "ctrl+shift+alt+g"
  # SHA-256 hash of "Admin@123" (需要管理员修改)
  admin_password_hash: "240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9"

# 日志配置
logging:
  path: "C:\\ProgramData\\ClassroomGuard\\logs"
  retention_days: 30

# 浏览器控制沙盒（Playwright）：在独立 Chromium 实例内直接管控浏览器内容
browser_sandbox:
  enabled: true                # 是否随主进程自动启动
  headless: false              # false=有头模式（可观察控制过程）；true=无头后台
  user_data_dir: ""            # 独立用户数据目录，留空= %LOCALAPPDATA%\AOTE\chromium_profile（不污染主浏览器）
  default_url: "about:blank"   # 启动后默认打开的页面
  max_captured: 1000           # 响应捕获缓冲上限
  # 自定义 Chromium 启动参数（覆盖默认值，含 --disable-web-security /
  # --proxy-server / --remote-debugging-port；--user-data-dir 始终自动追加）
  launch_args: []

# HTTP服务配置（浏览器沙盒通信/状态上报）
http_server:
  host: "127.0.0.1"
  port: 8765
  heartbeat_timeout: 30  # 秒，沙盒心跳超时阈值
