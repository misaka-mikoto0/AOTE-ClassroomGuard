# config.yaml - AOTE 管控系统配置文件

# 时间调度配置
# 上课时间段（宽松模式，不拦截）；非上课时间为严格模式（拦截）
schedule:
  weekday:
    # 周一至周五统一课表（第1节~第12节）
    1: [["05:45", "07:10"],   # 第1节
        ["08:05", "08:50"],   # 第2节
        ["09:00", "09:45"],   # 第3节
        ["10:20", "11:05"],   # 第4节
        ["11:15", "12:00"],   # 第5节
        ["14:30", "15:15"],   # 第6节
        ["15:25", "16:10"],   # 第7节
        ["16:20", "17:05"],   # 第8节
        ["17:35", "18:20"],   # 第9节
        ["19:00", "19:50"],   # 第10节
        ["20:00", "20:50"],   # 第11节
        ["21:00", "22:20"]]   # 第12节
    2: [["05:45", "07:10"], ["08:05", "08:50"], ["09:00", "09:45"], ["10:20", "11:05"], ["11:15", "12:00"], ["14:30", "15:15"], ["15:25", "16:10"], ["16:20", "17:05"], ["17:35", "18:20"], ["19:00", "19:50"], ["20:00", "20:50"], ["21:00", "22:20"]]
    3: [["05:45", "07:10"], ["08:05", "08:50"], ["09:00", "09:45"], ["10:20", "11:05"], ["11:15", "12:00"], ["14:30", "15:15"], ["15:25", "16:10"], ["16:20", "17:05"], ["17:35", "18:20"], ["19:00", "19:50"], ["20:00", "20:50"], ["21:00", "22:20"]]
    4: [["05:45", "07:10"], ["08:05", "08:50"], ["09:00", "09:45"], ["10:20", "11:05"], ["11:15", "12:00"], ["14:30", "15:15"], ["15:25", "16:10"], ["16:20", "17:05"], ["17:35", "18:20"], ["19:00", "19:50"], ["20:00", "20:50"], ["21:00", "22:20"]]
    5: [["05:45", "07:10"], ["08:05", "08:50"], ["09:00", "09:45"], ["10:20", "11:05"], ["11:15", "12:00"], ["14:30", "15:15"], ["15:25", "16:10"], ["16:20", "17:05"], ["17:35", "18:20"], ["19:00", "19:50"], ["20:00", "20:50"], ["21:00", "22:20"]]
    6: []                                          # 周六
    7: []                                          # 周日
  exceptions:
    "2026-09-10": "holiday"    # 教师节放假
    "2026-10-08": "classday"   # 调休上课

# 浏览器内容管控规则（基于域名，无需操作系统进程操作）
browser_rules:
  # 严格模式下拦截的娱乐/游戏域名（访问即拦截并自动切换弱网）
  block_domains:
    - "bilibili.com"
    - "youtube.com"
    - "youku.com"
    - "iqiyi.com"
    - "douyin.com"
    - "kuaishou.com"
    - "steampowered.com"
    - "epicgames.com"
    - "4399.com"
    - "7k7k.com"
    - "wanmei.com"
    - "gog.com"
  # 白名单域名（始终放行，如学习/政务站点）
  allowed_domains:
    - "edu.cn"
    - "gov.cn"
    - "baidu.com"
    - "bing.com"
    - "qq.com"
    - "alipay.com"
  # 自定义拦截页 HTML（留空使用内置默认页）
  blocked_page_html: ""
  # 非上课时间（严格模式）是否全面禁止视频播放：
  # 双管齐下——JS 层禁用播放逻辑 + 网络层拦截视频资源请求，
  # 无论访问什么网站（含学习站点内嵌视频）都无法播放。
  video_block_enabled: true
  # 弱网管控（命中黑名单即时切换，不影响非黑名单网站）：
  # 访问黑名单域名/URL 时，该页面立即限速为弱网（CDP 模拟延迟 + 限速），
  # 且每个命中黑名单的请求额外附加 delay_ms 延迟；离开黑名单站点超
  # min_duration 秒后自动恢复网络。
  weak_network:
    enabled: true              # 是否启用弱网管控
    delay_ms: 3000             # 命中黑名单的每个请求附加延迟（毫秒）
    latency_ms: 800            # CDP 模拟网络延迟（毫秒）
    download_kbps: 128         # 下载限速（KB/s）
    upload_kbps: 64            # 上传限速（KB/s）
    min_duration: 15           # 弱网最短持续时间（秒），防止频繁抖动

# U盘授权配置
usb_guard:
  whitelist_serials:
    - "A1B2C3D4E5F6"
    - "G7H8I9J0K1L2"
  key_filename: ".guardian_key"
  # SHA-256 hash of "AOTE-Admin-Key-2026" (需要管理员修改)
  key_hash_sha256: "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8"

# 解锁模式
unlock_modes:
  - { name: "即拔即禁", type: "eject" }
  - { name: "30分钟", type: "timer", seconds: 1800 }
  - { name: "1小时", type: "timer", seconds: 3600 }
  - { name: "2小时", type: "timer", seconds: 7200 }

# 紧急/管理员配置
emergency:
  hotkey: "ctrl+shift+alt+g"
  # SHA-256 hash of "Admin@123" (需要管理员修改)
  admin_password_hash: "240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9"

# 防绕过模块配置（浏览器沙盒心跳监控）
anti_tamper:
  monitor_interval: 2     # 心跳检查间隔（秒）

# 日志配置
logging:
  path: "C:\\ProgramData\\ClassroomGuard\\logs"
  retention_days: 30

# 浏览器控制沙盒（Playwright）：在独立浏览器实例内直接管控浏览器内容
browser_sandbox:
  enabled: true                # 是否随主进程自动启动
  headless: false              # false=有头模式（可观察控制过程）；true=无头后台
  # 本地浏览器适配（无需下载 Playwright 自带 Chromium）：
  #   "auto"  = 自动探测本机 Edge/Chrome 并直接复用（推荐，无需下载任何浏览器）
  #   "msedge"= 使用系统已安装的 Microsoft Edge
  #   "chrome"= 使用系统已安装的 Google Chrome
  #   ""      = 使用 Playwright 自带 Chromium（需先执行 python -m playwright install chromium）
  browser_channel: "auto"
  # 直接指定浏览器可执行文件完整路径（优先级最高，兼容任意 Chromium 内核浏览器，
  # 如 360/QQ 极速版等），留空表示不指定。示例：
  # executable_path: "C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe"
  executable_path: ""
  # CDP 连接模式（调试推荐）：非空时不再自行启动浏览器，而是接管已打开的浏览器。
  # 留空 "" = 自主启动浏览器模式（与之前行为一致）。
  connect_cdp_url: "http://127.0.0.1:9222"
  # ===== 全入口接管（无论通过何种方式打开浏览器，都纳入 CDP 管控）=====
  # 浏览器必须带调试端口才能被 CDP 接管，而用户从任务栏/开始菜单/热搜等入口
  # 打开的普通浏览器默认不带。AOTE 通过以下机制实现"任何入口都受管"：
  #   1) monitor_browser_processes: 持续监控系统内浏览器进程，凡不带调试参数的
  #      浏览器进程一律终止接管（最兜底的一环，请保持开启）；
  #   2) auto_spawn_browser: CDP 连接超时后自动拉起受管浏览器（无需用户双击
  #      专用快捷方式），配合 profile 单实例机制，后续从任意入口打开的
  #      浏览器请求都会转发到该受管实例；
  #   3) 可选辅助脚本 scripts/hijack_browser_entries.ps1：把桌面/开始菜单/任务栏
  #      快捷方式及 http/https 链接关联统一改为带调试端口启动（需管理员手动执行，
  #      支持 -Revert 还原）。
  monitor_browser_processes: true
  auto_spawn_browser: true
  user_data_dir: ""            # 独立用户数据目录，留空= %LOCALAPPDATA%\AOTE\chromium_profile（不污染主浏览器）
  default_url: "about:blank"   # 启动后默认打开的页面
  max_captured: 1000           # 响应捕获缓冲上限
  # 自定义浏览器启动参数（覆盖默认值，含 --disable-web-security /
  # --proxy-server / --remote-debugging-port；--user-data-dir 始终自动追加）
  launch_args: []

# HTTP服务配置（浏览器沙盒通信/状态上报）
http_server:
  host: "127.0.0.1"
  port: 8765
  heartbeat_timeout: 30  # 秒，沙盒心跳超时阈值
