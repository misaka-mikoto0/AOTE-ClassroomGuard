      enabled: true
      # 扫雷 / 纸牌 / 益智 / 方块 / 竞技 / 球类 / 反应测试 / 火影忍者
      pattern: '扫雷|Minesweeper|21点|二十一点|Blackjack|2048|数图|Picross|数独|数字金字塔|金字塔纸牌|Lights\s*Off|俄罗斯方块|水果忍者|荒野乱斗|我的世界|Minecraft|灾难竞技场|谋杀|Murder|台球|桌球|8\s*[-\s]?ball|反应(?:时间|力|速度)测试|Human\s*Benchmark|火影忍者'

  # 自定义拦截页 HTML（留空使用内置默认页）
  blocked_page_html: ""
  # 非上课时间（严格模式）是否全面禁止视频播放：
  # 双管齐下——JS 层禁用播放逻辑 + 网络层拦截视频资源请求，
  # 无论访问什么网站（含学习站点内嵌视频）都无法播放。
  video_block_enabled: true
  # 弱网管控（命中黑名单即时切换，不影响非黑名单网站）：
  # 访问黑名单域名/URL 时，该页面立即限速为弱网（CDP 模拟延迟 + 限速），
  # 且每个命中黑名单的请求额外附加 delay_ms 延迟；离开黑名单站点超
  # min_duration 秒后自动恢复网络。
  weak_network:
    enabled: true              # 是否启用弱网管控
    delay_ms: 3000             # 命中黑名单的每个请求附加延迟（毫秒）
    latency_ms: 800            # CDP 模拟网络延迟（毫秒）
    download_kbps: 128         # 下载限速（KB/s）
    upload_kbps: 64            # 上传限速（KB/s）
    min_duration: 15           # 弱网最短持续时间（秒），防止频繁抖动

# U盘授权配置
usb_guard:
  whitelist_serials:
    - "A1B2C3D4E5F6"
    - "G7H8I9J0K1L2"
  key_filename: ".guardian_key"
  # SHA-256 hash of "AOTE-Admin-Key-2026" (需要管理员修改)
  key_hash_sha256: "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8"

# 解锁模式
unlock_modes:
  - { name: "即拔即禁", type: "eject" }
  - { name: "30分钟", type: "timer", seconds: 1800 }
  - { name: "1小时", type: "timer", seconds: 3600 }
  - { name: "2小时", type: "timer", seconds: 7200 }

# 紧急/管理员配置
emergency:
  hotkey: "ctrl+shift+alt+g"
  # SHA-256 hash of "Admin@123" (需要管理员修改)
  admin_password_hash: "240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9"

# 防绕过模块配置（浏览器沙盒心跳监控）
anti_tamper:
  monitor_interval: 2     # 心跳检查间隔（秒）

# 日志配置
logging:
  path: "C:\\ProgramData\\ClassroomGuard\\logs"
  retention_days: 30

# 浏览器控制沙盒（Playwright）：通过 CDP 接管外部浏览器内容管控
# 注意：系统不再自动打开/拉起浏览器，须由用户通过带调试端口的快捷方式手动打开，
# 沙盒连接后即接管（可配合 scripts/hijack_browser_entries.ps1 统一各入口）。
# 接管不强制依赖独立文件目录参数（--user-data-dir）：浏览器只要带任意调试开关即
# 判定为受管；若完全不带调试参数，则被进程监控终止并自动以受管参数重启接管。
browser_sandbox:
  enabled: true                # 是否随主进程自动启动（仅接管，不自动打开浏览器）
  # CDP 连接地址：接管在此调试端口上启动的外部浏览器。
  connect_cdp_url: "http://127.0.0.1:9222"
  # ===== 全入口接管（无论通过何种方式打开浏览器，都纳入 CDP 管控）=====
  # 浏览器必须带调试端口才能被 CDP 接管，而用户从任务栏/开始菜单/热搜等入口
  # 打开的普通浏览器默认不带。AOTE 通过以下机制实现"任何入口都受管"：
  #   1) monitor_browser_processes: 持续监控系统内浏览器进程，凡不带调试参数的
  #      浏览器进程一律终止接管（最兜底的一环，请保持开启）；
  #   2) 可选辅助脚本 scripts/hijack_browser_entries.ps1：把桌面/开始菜单/任务栏
  #      （状态栏）固定快捷方式及 http/https URL 关联统一改为带调试端口启动
  #      （写入 HKCU\Software\Classes\MSEdgeHTM\shell\open\command 覆盖，无需管理员；
  #      支持 -Revert 还原，原值备份于 %LOCALAPPDATA%\AOTE\）。
  monitor_browser_processes: true
  # 兜底接管（不依赖快捷方式里的 --user-data-dir 参数）：
  # 当浏览器未带调试参数（含快捷方式参数被删、或调试参数被已运行的默认 profile
  # 实例吞掉导致端口未开启）时，终止该实例并自动以受管参数（connect_cdp_url 对应
  # 端口 + 独立 profile）重新拉起浏览器，保证任何入口都能被 AOTE 接管。
  # 置 false：未受管浏览器仅被终止，不自动重启（需用户自行从带参数的入口打开）。
  auto_relaunch_managed: true
  # 上课时段（宽松模式）不接管浏览器进程：此时本就不拦截任何站点，
  # 终止未受管浏览器只会打断正常教学使用；进入非上课时段（严格模式）自动恢复接管。
  # 置 false 则恢复为"任何时段都对未受管浏览器执行终止接管"。
  takeover_only_in_strict: true
  user_data_dir: ""            # 独立用户数据目录，留空= %LOCALAPPDATA%\AOTE\cdp_debug_profile（不污染主浏览器）
  max_captured: 1000           # 响应捕获缓冲上限

# HTTP服务配置（浏览器沙盒通信/状态上报）
http_server:
  host: "127.0.0.1"
  port: 8765
  heartbeat_timeout: 30  # 秒，沙盒心跳超时阈值
