# config.yaml - AOTE 管控系统配置文件

# 时间调度配置
# 上课时间段（宽松模式，不拦截）；非上课时间为严格模式（拦截）
schedule:
  weekday:
    # 周一至周五统一课表（第1节~第12节）
    1: [["05:45", "07:10"],   # 第1节
        ["08:05", "08:45"],   # 第2节
        ["09:00", "09:40"],   # 第3节
        ["10:20", "11:00"],   # 第4节
        ["11:15", "11:55"],   # 第5节
        ["14:30", "15:10"],   # 第6节
        ["15:25", "16:05"],   # 第7节
        ["16:20", "17:00"],   # 第8节
        ["17:50", "18:30"],   # 第9节
        ["19:10", "20:00"],   # 第10节
        ["20:10", "21:00"],   # 第11节
        ["21:10", "22:20"]]   # 第12节
    2: [["05:45", "07:10"], ["08:05", "08:45"], ["09:00", "09:40"], ["10:20", "11:00"], ["11:15", "11:55"], ["14:30", "15:10"], ["15:25", "16:05"], ["16:20", "17:00"], ["17:50", "18:30"], ["19:10", "20:00"], ["20:10", "21:00"], ["21:10", "22:20"]]
    3: [["05:45", "07:10"], ["08:05", "08:45"], ["09:00", "09:40"], ["10:20", "11:00"], ["11:15", "11:55"], ["14:30", "15:10"], ["15:25", "16:05"], ["16:20", "17:00"], ["17:50", "18:30"], ["19:10", "20:00"], ["20:10", "21:00"], ["21:10", "22:20"]]
    4: [["05:45", "07:10"], ["08:05", "08:45"], ["09:00", "09:40"], ["10:20", "11:00"], ["11:15", "11:55"], ["14:30", "15:10"], ["15:25", "16:05"], ["16:20", "17:00"], ["17:50", "18:30"], ["19:10", "20:00"], ["20:10", "21:00"], ["21:10", "22:20"]]
    5: [["05:45", "07:10"], ["08:05", "08:45"], ["09:00", "09:40"], ["10:20", "11:00"], ["11:15", "11:55"], ["14:30", "15:10"], ["15:25", "16:05"], ["16:20", "17:00"], ["17:50", "18:30"], ["19:10", "20:00"], ["20:10", "21:00"], ["21:10", "22:20"]]
    6: []                                          # 周六
    7: []                                          # 周日
  exceptions:
    "2026-09-10": "holiday"    # 教师节放假
    "2026-10-08": "classday"   # 调休上课

# 豁免时间段（全局豁免窗口）
# 语义：当前时间落在任一"生效窗口"内时，所有原本生效的限制规则自动暂停，
#       不产生任何约束作用；窗口结束后的下一轮检查（time_settings.time_check_interval，
#       默认 5 秒）内自动恢复原模式（严格/宽松仍由课表决定）。
#
# 起止定义（HH:MM，本地时间，左闭右开 [start, end)）：
#   - 同天窗口：["12:00", "13:30"] = 12:00:00 ~ 13:29:59
#   - 跨天窗口：end <= start，如 ["22:30", "06:30"] = 当天 22:30 至次日 06:30
#   - 起止相同：["08:00", "08:00"] 按全天生效处理（沿用课表的容错语义）
#
# 生效范围（等同"临时解锁"，全部限制暂停）：
#   主题限制 / 游戏关键词 / 标题正则 / 域名黑名单 / 视频管控 / 弱网限速 /
#   域名重定向 / 未受管浏览器接管 —— 全部暂停。
#   白名单（allowed_domains / always_allowed_domains）等"放行类"配置不受影响。
#   与课表的关系：豁免窗口优先于课表判定；窗口内不再切换严格/宽松，
#   窗口结束后按课表重新判定，因此不会破坏原有排课逻辑。
#   与紧急模式的关系：紧急模式（防绕过触发）优先级最高，豁免窗口不覆盖它。
exempt_windows:
  enabled: true
  # 上课时间视为"已获豁免"（默认开启）：
  #   true  -> 上课时段 = 豁免状态，与所有限制一并暂停（含"始终生效"的主题/
  #            游戏关键词/标题正则、视频管控、弱网、重定向、浏览器接管）
  #   false -> 回到旧语义：上课时段仅放宽（MODE_RELAXED），"始终生效"的
  #            topic_blocks 仍会拦截
  # 上课/放假的判定完全来自 schedule.weekday 与 schedule.exceptions，未改动。
  class_time_exempt: true
  # 生效星期（ISO：1=周一 … 7=周日）；省略或留空 = 每天生效。
  # 注意：星期/日期过滤按"判定时刻所在的那一天"计算；跨天窗口若要覆盖次日，
  #       需把次日也写进 weekdays（例如周日 22:30-周一06:30 需含 7 和 1）。
  weekdays: [1, 2, 3, 4, 5, 6, 7]
  # 生效窗口列表（可多条）。默认留空 = 不启用任何豁免，功能处于待配置状态。
  time_ranges: []
    # - ["12:00", "13:30"]   # 午休
    # - ["21:40", "22:00"]   # 晚自习课间
    # - ["22:30", "06:30"]   # 跨天：睡前
  # 日期过滤（YYYY-MM-DD）：dates 非空时，仅这些日期生效（临时性豁免用）
  dates: []
  # 排除日期：命中则该日整体不豁免（优先级最高，可用来临时关闭某天豁免）
  exclude_dates: []

# 进程守护与后台运行
# 说明：本区块只使用"常规、可见、可审计"的手段——进程在任务管理器中始终可见，
#       可查看、可结束；不使用任何隐藏进程、冻结进程或内核级技术。
guardian:
  enabled: true                  # 总开关：守护 + 防关停（关闭后仅保留自启）
  # 非授权退出（被任务管理器结束、崩溃）后，由计划任务按周期自动拉起
  restart_on_unexpected_exit: true
  # 授权退出（托盘/热键输入管理员密码退出）后不再自动拉起，直到下次登录。
  # 置 false 则无论何种方式退出都会被拉起。
  respect_authorized_exit: true
  # 守护检查周期（分钟，最小 1；Windows 计划任务的最细粒度为 1 分钟）
  watchdog_interval_minutes: 1
  # 静默后台：true = 不显示托盘图标（通知区域无条目）。
  # 此时唯一管理入口是热键 Ctrl+Shift+Alt+G（仍需管理员密码）。
  # 默认 false，保持与原来一致：托盘图标可见。
  hide_tray_icon: false

# 时间参数配置（统一从本区块读取，代码中不再硬编码时间值）
# 涵盖：超时时间、刷新/轮询间隔、定时任务执行时间、缓存/去抖过期时间等
time_settings:
  # ---- 各组件轮询/检查/刷新间隔（秒）----
  main_loop_interval: 1            # 主进程主循环休眠间隔
  config_reload_interval: 5        # 配置热重载检查间隔
  time_check_interval: 5           # 时间调度检查间隔
  tray_refresh_interval: 3         # 托盘菜单状态刷新间隔
  http_poll_interval: 1            # HTTP 服务轮询间隔
  usb_poll_interval: 1.5           # U盘检测轮询间隔
  usb_mount_delay: 0.5             # U盘插入后挂载稳定等待时间
  usb_eject_restore_delay: 3.0     # 即拔即禁拔出后恢复严格模式延迟
  # ---- 超时时间（秒）----
  sandbox_call_timeout: 30         # 浏览器沙盒线程安全调用超时
  sandbox_start_timeout: 60        # 浏览器沙盒启动等待超时
  page_load_timeout_ms: 15000      # 默认页面加载超时（毫秒）
  password_dialog_timeout: 120     # 管理员密码验证框超时
  component_stop_timeout: 3        # 组件停止等待超时
  tasklist_timeout: 5              # 浏览器进程查询（tasklist）超时
  powershell_timeout: 15           # 浏览器进程命令行查询（PowerShell）超时
  taskkill_timeout: 10             # 终止浏览器进程（taskkill）超时
  browser_relaunch_cooldown: 10    # 自动接管重启浏览器的最小间隔（秒），防止失败时高频重试
  # ---- 浏览器沙盒心跳/重连/监控（秒）----
  sandbox_heartbeat_interval: 0.5  # 心跳刷新间隔
  cdp_retry_interval: 1            # CDP 连接/重连尝试间隔
  browser_monitor_interval: 3      # 浏览器进程监控扫描间隔
  cdp_retry_notify_every: 10       # CDP 重试每 N 次提示一次
  # ---- 缓存/去抖过期时间（秒）----
  violation_cooldown: 10           # 同一 URL 违规通知去抖时间
  # ---- 定时任务执行时间 ----
  log_rotate_when: "midnight"      # 日志轮转时机（"midnight"=每日零点）
  # ---- 临时解锁时长（秒）----
  tray_unlock_5min: 300            # 托盘菜单「临时解锁 5 分钟」
  tray_unlock_30min: 1800          # 托盘菜单「临时解锁 30 分钟」
  unlock_options: [300, 600, 1800, 3600]   # 管理员面板解锁时长选项（秒）
  max_custom_unlock_minutes: 180   # 管理员面板自定义解锁时长上限（分钟）

# 浏览器内容管控规则（基于域名，无需操作系统进程操作）
browser_rules:
  # 严格模式下拦截的娱乐/游戏域名（访问即拦截并自动切换弱网）
  block_domains:
    - "bilibili.com"
    - "youtube.com"
    - "youku.com"
    - "iqiyi.com"
    - "douyin.com"
    - "kuaishou.com"
    - "steampowered.com"
    - "epicgames.com"
    - "4399.com"
    - "7k7k.com"
    - "wanmei.com"
    - "gog.com"
  # 白名单域名（严格模式下优先于黑名单放行，如学习/政务站点）
  # 注意：这里只跳过 block_domains，拦不住 topic_blocks / game_keywords。
  allowed_domains:
    - "edu.cn"
    - "gov.cn"
    - "baidu.com"
    - "bing.com"
    - "qq.com"
    - "alipay.com"

  # 全局豁免白名单（最高优先级，早于一切策略判断）：
  # 命中域名及其全部子域名、任意路径的请求，不受任何应用层策略拦截——
  # 包括主题限制、游戏关键词、视频管控、弱网限速、域名重定向、域名黑名单。
  always_allowed_domains:
    - "sjdm.my0811.cn"
    # 微信官方根域：'weixin.com' 即覆盖 裸域 + 全部子域 + 任意路径
    # （weixin.com、www.weixin.com、open.weixin.qq.com 这类不属于本域，见下方说明）
    - "weixin.com"

  # 域名重定向：访问命中域名时，在页面加载前直接 302 跳转到 target
  #（请求阶段即返回，浏览器不向原站发请求、不渲染原站任何内容）。
  # domains 支持 'mi.com' 与 '*.mi.com' 两种写法，二者均覆盖裸域 + 全部子域名
  # + 任意路径（如 www.mi.com、order.mi.com、mall.mi.com/shop/... 一律命中）。
  redirect_rules:
    - name: "小米官网 -> Apple"
      enabled: true
      domains:
        - "mi.com"
        - "mi.cn"
        - "xiaomi.com"      # 小米另一官方主域（国际站），如不需要可删此行
        - "xiaomi.cn"
      target: "https://www.apple.com"

  # 主题内容限制：命中关键词的页面一律阻止加载并显示统一受限提示。
  # 覆盖直接链接、站内搜索、推荐跳转、外部引荐等入口；检测维度可分别开关：
  #   url      URL 与查询串（路由层拦截，无需等页面渲染）
  #   title    页面标题    meta  页面元数据（keywords/description/og 等）
  #   content  正文主题（取前 4000 字符）
  # 命中后会向本地服务上报，记入违规日志以便审计。管理员密码 / U盘解锁时放行。
  topic_blocks:
    # 每条规则省略的可选项及其默认值：
    #   check_url=true  check_title=true  check_meta=true  check_content=true
    #   strict_mode_only=false（false=始终生效；true=仅在非上课时段生效）
    - name: "火影忍者"
      enabled: true
      keywords: ["火影忍者", "火影", "naruto", "ナルト", "漩涡鸣人", "宇智波"]
    - name: "王者荣耀"
      enabled: true
      keywords: ["王者荣耀", "honor of kings", "王者峡谷"]
    - name: "英雄联盟"
      enabled: true
      keywords: ["英雄联盟", "英雄聯盟", "league of legends"]
    - name: "和平精英"
      enabled: true
      keywords: ["和平精英", "绝地求生", "刺激战场", "pubg"]
    - name: "原神"
      enabled: true
      keywords: ["原神", "genshin impact"]
    - name: "穿越火线"
      enabled: true
      keywords: ["穿越火线", "crossfire"]
    - name: "地下城与勇士"
      enabled: true
      keywords: ["地下城与勇士", "dungeon fighter", "dnf"]
    - name: "我的世界"
